receivers:
  otlp:
    protocols:
      grpc:
    
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:COLLECTOR_MEM_LIMIT_MB}
    spike_limit_mib: ${env:COLLECTOR_SPIKE_LIMIT_MB}
  batch/traces:
    timeout: 1s
    send_batch_size: 50
    send_batch_max_size: 200
  batch/metrics:
    timeout: 10s
    send_batch_size: 200
    send_batch_max_size: 1000
  batch/logs:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 8000
  filter/traces:
    traces:
      span: # Filter Xray Sampler requests, health and metrics
        - >
          IsMatch(attributes["url.full"], ".*(GetSamplingRules|SamplingTargets|/healthcheck|/health|/metrics).*") or
          IsMatch(attributes["http.route"], ".*(GetSamplingRules|SamplingTargets|/healthcheck|/health|/metrics).*") or
          IsMatch(attributes["http.url"], ".*(GetSamplingRules|SamplingTargets|/healthcheck|/health|/metrics).*")
  filter/self-metrics: # Filter to items for alerting and basic monitoring  - exporter fail metrics only emit on failure
    error_mode: ignore # Sample alerts / dash (note some meters are custom/outdated) on https://github.com/monitoringartist/opentelemetry-collector-monitoring
    metrics:
      metric:
        - 'IsMatch(name, "^scrape_")'
        - 'IsMatch(name, "^otelcol_") and
            not (
              name == "otelcol_receiver_refused_spans" or
              name == "otelcol_receiver_refused_metric_points" or
              name == "otelcol_receiver_refused_log_records" or
              name == "otelcol_exporter_enqueue_failed_spans" or
              name == "otelcol_exporter_enqueue_failed_metric_points" or
              name == "otelcol_exporter_enqueue_failed_log_records" or
              name == "otelcol_exporter_send_failed_log_records" or
              name == "otelcol_exporter_send_failed_spans" or
              name == "otelcol_exporter_send_failed_metric_points" or
              name == "otelcol_exporter_queue_size" or
              name == "otelcol_exporter_queue_capacity" or
              name == "otelcol_process_memory_rss" or
              name == "otelcol_process_cpu_seconds" or
              name == "otelcol_process_uptime")'
  # Disable this If you are using a AWS XRay remote sampler or another sampler on app side 
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow-traces
        type: latency
        latency: { threshold_ms: 2000 }
      - name: probabilistic
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }

exporters:
  awsxray:
    region: ${env:AWS_REGION}
  awsemf:
    region: ${env:AWS_REGION}
    log_retention: ${env:METRIC_RETENTION_DAYS}
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: ${env:LOG_GROUP_NAME}
    log_stream_name: ${env:LOG_GROUP_STREAM}
    log_retention: ${env:LOG_RETENTION_DAYS}

extensions:
  health_check:
  awsproxy: #X-ray remote sampler
    region: ${env:AWS_REGION}

service:
  extensions: [awsproxy,health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter,batch/logs]
      exporters: [awscloudwatchlogs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter,filter/traces,tail_sampling,batch/traces]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter,filter/self-metrics,batch/metrics]
      exporters: [awsemf]
  telemetry:
    resource:
        service.name: opentelemetry-collector/metrics
    metrics:
      readers:
        - periodic:
            interval: 10000
            exporter:
              otlp:
                protocol: grpc
                endpoint: localhost:4317
                insecure: true
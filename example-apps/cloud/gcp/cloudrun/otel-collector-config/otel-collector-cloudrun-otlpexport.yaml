# Tested with google-cloud-opentelemetry-collector/otelcol-google:0.151.0
# This configuration is based off GCP samples
# https://github.com/GoogleCloudPlatform/opentelemetry-operations-collector/blob/v0.151.0/google-built-opentelemetry-collector/docs/examples/configuration/config-standard.yaml
# https://github.com/GoogleCloudPlatform/golang-samples/blob/8d0adc7d04866c0f870c7964654bf7af49bf4c7f/run/custom-metrics/collector/collector-config.yaml
# https://github.com/GoogleCloudPlatform/otlp-k8s-ingest/blob/v0.5.0/config/collector.yaml
# https://github.com/GoogleCloudPlatform/opentelemetry-cloud-run/blob/32dae7cc0c8e1f6c7ad3be69b8d22e4bd03e7d28/csharp/collector/collector-config.yaml
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  googleclientauth:
    project: ${GOOGLE_CLOUD_PROJECT}
    quota_project: ${GOOGLE_CLOUD_PROJECT}

receivers:
  otlp:
    protocols:
      grpc:
          
processors:
  batch:
    # Based on googles example collector settings
    send_batch_max_size: 200
    send_batch_size: 200
    timeout: 5s
  memory_limiter:
    # Based on googles example collector settings
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20
  resourcedetection: # Just a precaution if telemetry sent hasnt set GCP resource attribs
    detectors: [gcp]
    timeout: 2s
    override: false
  # This transform processor avoids ingestion errors if metrics contain datapoint.attributes with names that are reserved for the prometheus_target resource.
  transform/collision:
    metric_statements:
      - set(datapoint.attributes["exported_location"], datapoint.attributes["location"])
      - delete_key(datapoint.attributes, "location")
      - set(datapoint.attributes["exported_cluster"], datapoint.attributes["cluster"])
      - delete_key(datapoint.attributes, "cluster")
      - set(datapoint.attributes["exported_namespace"], datapoint.attributes["namespace"])
      - delete_key(datapoint.attributes, "namespace")
      - set(datapoint.attributes["exported_job"], datapoint.attributes["job"])
      - delete_key(datapoint.attributes, "job")
      - set(datapoint.attributes["exported_instance"], datapoint.attributes["instance"])
      - delete_key(datapoint.attributes, "instance")
      - set(datapoint.attributes["exported_project_id"], datapoint.attributes["project_id"])
      - delete_key(datapoint.attributes, "project_id")
  transform/set_project_id: # From Google's otel collector sample (link at top)
    error_mode: ignore
    trace_statements:
    - set(resource.attributes["gcp.project_id"], resource.attributes["gcp.project.id"]) where resource.attributes["gcp.project.id"] != nil
    - set(resource.attributes["gcp.project_id"], resource.attributes["cloud.account.id"]) where resource.attributes["gcp.project_id"] == nil and resource.attributes["cloud.account.id"] != nil
  transform/fix_severity:
    log_statements: # Normalise .Net ILogger severity to work with GCP
      - set(log.severity_text, "TRACE") where log.severity_text == "Trace"
      - set(log.severity_text, "DEBUG") where log.severity_text == "Debug"
      - set(log.severity_text, "INFO")  where log.severity_text == "Information"
      - set(log.severity_text, "WARN")  where log.severity_text == "Warning"
      - set(log.severity_text, "ERROR") where log.severity_text == "Error"
      - set(log.severity_text, "FATAL") where log.severity_text == "Critical"
  # Optional: enables structured logging (jsonPayload) for querying log parameters when
  # your app otel sdk logging setting 'IncludeFormattedMessage' is false.
  # Eg. message will have: 'message {parameter}' and carried over to jsonPayload.message
  # https://cloud.google.com/logging/docs/structured-logging
  transform/conditional_logs_structured:
    log_statements:
    - context: log
      conditions:
       - IsMatch(body, ".*\\{[^}]+\\}.*")
      statements:
      - set(attributes["message"], body)
      - set(body, attributes)
  # When your app otel sdk logging setting 'IncludeFormattedMessage' is true.
  # Eg. message will have: 'message the-parameter-value' nd carried over to jsonPayload.message
  # Note the '{OriginalFormat}' field is copied over to the jsonPayload if you need to query by that
  transform/conditional_logs_structured_fromformatted:
    log_statements:
    - context: log
      conditions:
        - attributes["{OriginalFormat}"] != nil
      statements:
        - set(attributes["message"], body)
        - set(body, attributes)
  transform/log_name: # to specify a log nam other than the default 'otlp'
    log_statements:
      - statements:
          - set(log.attributes["gcp.log_name"], "${GOOGLE_CLOUD_LOG_NAME}") where log.attributes["gcp.log_name"] == nil
  filter/traces: # Filter out health and metrics
    traces:
      span: 
        - >
          IsMatch(attributes["url.full"], ".*(/healthcheck|/health|/metrics).*") or
          IsMatch(attributes["http.route"], ".*(/healthcheck|/health|/metrics).*") or
          IsMatch(attributes["http.url"], ".*(/healthcheck|/health|/metrics).*")
  filter/self-metrics: # Filter to items for alerting and basic monitoring  - exporter fail metrics only emit on failure
    error_mode: ignore # Sample alerts / dash (note some meters are custom/outdated) on https://github.com/monitoringartist/opentelemetry-collector-monitoring
    metrics:
      metric:
        - 'IsMatch(name, "^scrape_")'
        - 'IsMatch(name, "^otelcol_") and
            not (
              name == "otelcol_receiver_refused_spans" or
              name == "otelcol_receiver_refused_metric_points" or
              name == "otelcol_receiver_refused_log_records" or
              name == "otelcol_exporter_enqueue_failed_spans" or
              name == "otelcol_exporter_enqueue_failed_metric_points" or
              name == "otelcol_exporter_enqueue_failed_log_records" or
              name == "otelcol_exporter_send_failed_log_records" or
              name == "otelcol_exporter_send_failed_spans" or
              name == "otelcol_exporter_send_failed_metric_points" or
              name == "otelcol_exporter_queue_size" or
              name == "otelcol_exporter_queue_capacity" or
              name == "otelcol_process_memory_rss" or
              name == "otelcol_process_cpu_seconds" or
              name == "otelcol_process_uptime")'
  tail_sampling: # For use when running a centralised collector on cloud run
    # How long to wait, after the first span of a trace arrives, before
    # deciding whether to keep it. Must be long enough for the slowest
    # leg of your traces to complete, or you'll cut traces short.
    decision_wait: 10s

    # Traces held in memory at once — size for your peak concurrent trace volume.
    # num_traces: 50000
    # expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow-traces
        type: latency
        latency:
          threshold_ms: 2000   # anything over 2s gets kept
      - name: keep-some-of-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10   # 10% of everything that isn't an error or slow
  resource/required_labels:
    attributes:
      - key: service.instance.id # normalise the resource detector to standard otel attrib - service name should be set on app
        from_attribute: faas.instance
        action: insert
      - key: gcp.project_id # set project id if not set 
        value: ${GOOGLE_CLOUD_PROJECT}
        action: insert
  
exporters:
  otlp_grpc:
    endpoint: telemetry.googleapis.com:443
    balancer_name: pick_first
    auth:
      authenticator: googleclientauth

service:
  extensions: [health_check, googleclientauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter,filter/traces,resourcedetection,resource/required_labels,transform/set_project_id,batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlp]
      processors: [memory_limiter,resourcedetection,resource/required_labels,transform/fix_severity,transform/log_name,batch]
      exporters: [otlp_grpc]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter,filter/self-metrics,resourcedetection,resource/required_labels,transform/collision,batch]
      exporters: [otlp_grpc]
  telemetry:
    resource:
        service.name: opentelemetry-collector/metrics
    metrics:
      readers:
        - periodic:
            interval: 10000
            exporter:
              otlp:
                protocol: grpc
                endpoint: localhost:4317
                insecure: true
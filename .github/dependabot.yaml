updates:
  - package-ecosystem: "nuget"
    directory: "/src/SimpleOpenTelemetry"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
    commit-message:
      prefix: "fix"

  - package-ecosystem: "nuget"
    directory: "/tests/SimpleOpenTelemetry.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
          - "Azure.Monitor.OpenTelemetry*"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "nuget"
    directory: "/tests/SimpleOpenTelemetry.IntegrationTests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
          - "Azure.Monitor.OpenTelemetry*"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

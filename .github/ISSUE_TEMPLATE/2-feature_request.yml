name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
projects: ["degero/4"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! The most useful part of a feature request is usually the **problem**, not the solution — describing what's difficult today lets us evaluate the best way to solve it.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's difficult, verbose, or impossible today? Why does it matter to you?
      placeholder: When configuring X, I currently have to do Y, which is awkward because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed? Be as concrete as you can — API shape, config option, expected behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, related issues, examples from other libraries, screenshots, etc.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to submit a PR for this
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/degero/simpleopentelemetry/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

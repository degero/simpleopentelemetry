name: Lint PR title
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  lint-pr-title:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly, optional

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: csharp
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0   # full history helps CodeQL/MinVer resolve versioning correctly
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended
        build-mode: ${{ matrix.build-mode }}
        config: |
          paths:
            - ${{ matrix.language == 'csharp' && 'src' || '.github/workflows' }}
    
    # Manual build — mirrors your real CI build exactly, so CodeQL sees
    # what actually compiles rather than guessing via autobuild.
    - name: Dotnet restore (lockfile)
      if: matrix.language == 'csharp'
      run: dotnet restore src/SimpleOpenTelemetry/SimpleOpenTelemetry.csproj --force-evaluate
    
    - name: Dotnet build
      if: matrix.language == 'csharp'
      run: dotnet build src/SimpleOpenTelemetry/SimpleOpenTelemetry.csproj -c Release --no-incremental --no-restore
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
